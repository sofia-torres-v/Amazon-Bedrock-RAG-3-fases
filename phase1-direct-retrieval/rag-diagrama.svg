<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Flujo de ingesta y consulta de un RAG" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#F58220"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .box { fill: #2a211f; stroke: #F58220; stroke-width: 2; }
      .t { font-size: 20px; text-anchor: middle; }
      .lbl { font-size: 18px; font-weight: 700; fill: #F58220; }
      .sub { font-size: 13px; fill: #b8aaa5; }
      .ln { stroke: #F58220; stroke-width: 2; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1000" height="330" rx="14" fill="#171211"/>

  <text x="30" y="90" class="lbl">INGESTA</text>
  <text x="30" y="110" class="sub">(una vez)</text>

  <rect class="box" x="190" y="60" width="150" height="70" rx="12"/><text class="t" x="265" y="102">Documento</text>
  <rect class="box" x="380" y="60" width="150" height="70" rx="12"/><text class="t" x="455" y="102">Chunks</text>
  <rect class="box" x="570" y="60" width="150" height="70" rx="12"/><text class="t" x="645" y="102">Embeddings</text>
  <rect class="box" x="760" y="60" width="170" height="70" rx="12"/><text class="t" x="845" y="102">Base vectorial</text>
  <line class="ln" x1="344" y1="95" x2="376" y2="95"/>
  <line class="ln" x1="534" y1="95" x2="566" y2="95"/>
  <line class="ln" x1="724" y1="95" x2="756" y2="95"/>

  <text x="30" y="240" class="lbl">CONSULTA</text>

  <rect class="box" x="190" y="205" width="130" height="70" rx="12"/><text class="t" x="255" y="247">Pregunta</text>
  <rect class="box" x="350" y="205" width="130" height="70" rx="12"/><text class="t" x="415" y="247">Búsqueda</text>
  <rect class="box" x="510" y="205" width="150" height="70" rx="12"/>
  <text class="t" x="585" y="237" style="font-size:18px">Prompt +</text><text class="t" x="585" y="259" style="font-size:18px">contexto</text>
  <rect class="box" x="690" y="205" width="110" height="70" rx="12"/><text class="t" x="745" y="247">LLM</text>
  <rect class="box" x="830" y="205" width="130" height="70" rx="12"/><text class="t" x="895" y="247">Respuesta</text>
  <line class="ln" x1="324" y1="240" x2="346" y2="240"/>
  <line class="ln" x1="484" y1="240" x2="506" y2="240"/>
  <line class="ln" x1="664" y1="240" x2="686" y2="240"/>
  <line class="ln" x1="804" y1="240" x2="826" y2="240"/>

  <!-- La base vectorial alimenta la búsqueda -->
  <path d="M845 134 V170 H415 V201" fill="none" stroke="#F58220" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="640" y="162" class="sub" text-anchor="middle">fragmentos más cercanos</text>
</svg>
