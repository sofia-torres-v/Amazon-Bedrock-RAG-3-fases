<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" width="1180" height="660" role="img" aria-label="Las tres fases: el mismo patrón RAG, quitando una capa de abstracción" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 Z" fill="#F58220"/>
    </marker>
    <style>
      text { font-family: 'Poppins','Segoe UI',Helvetica,Arial,sans-serif; fill: #ffffff; }
      .box { fill: #261e1c; stroke: #F58220; stroke-width: 1.5; }
      .gen { fill: #3a2a1c; stroke: #F58220; stroke-width: 2; }
      .grp { fill: #2f2219; stroke: #F58220; stroke-width: 1.5; }
      .n { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .s { font-size: 12.5px; text-anchor: middle; fill: #b9aca6; }
      .pill { fill: #F58220; }
      .pt { font-size: 14px; font-weight: 700; fill: #1a1210; text-anchor: middle; }
      .ft { font-size: 22px; font-weight: 700; }
      .fs { font-size: 14px; fill: #b9aca6; }
      .cap { font-size: 15px; fill: #F58220; }
      .hd { font-size: 14px; fill: #F58220; letter-spacing: 0.4px; }
      .div { stroke: #3a2f2c; stroke-width: 1; }
      .ln { stroke: #F58220; stroke-width: 2; marker-end: url(#a); }
    </style>
  </defs>

  <rect width="1180" height="660" rx="16" fill="#171211"/>
  <text x="40" y="38" class="hd">EL MISMO PATRÓN RAG, QUITANDO UNA CAPA DE ABSTRACCIÓN</text>

  <g transform="translate(0,24)">

    <!-- FASE 1 -->
    <rect class="pill" x="40" y="62" width="76" height="28" rx="14"/>
    <text class="pt" x="78" y="81">Fase 1</text>
    <text class="ft" x="40" y="134">Bedrock gestionado</text>
    <text class="fs" x="40" y="160">Solo la recuperación, sin generación</text>

    <rect class="box" x="360" y="84" width="132" height="84" rx="12"/>
    <text class="n" x="426" y="124">Documentos</text><text class="s" x="426" y="146">S3 · .txt</text>

    <rect class="grp" x="522" y="44" width="452" height="152" rx="14"/>
    <text class="n" x="748" y="70" style="font-size:15px">Amazon Bedrock Knowledge Bases</text>
    <rect class="box" x="538" y="84" width="132" height="84" rx="12"/><text class="n" x="604" y="132">Chunking</text>
    <rect class="box" x="682" y="84" width="132" height="84" rx="12"/><text class="n" x="748" y="132">Embeddings</text>
    <rect class="box" x="826" y="84" width="132" height="84" rx="12"/>
    <text class="n" x="892" y="121">Base</text><text class="n" x="892" y="143">vectorial</text>

    <rect class="box" x="1004" y="84" width="136" height="84" rx="12"/>
    <text class="n" x="1072" y="124">Lambda</text><text class="s" x="1072" y="146">Retrieve</text>

    <line class="ln" x1="496" y1="126" x2="518" y2="126"/>
    <line class="ln" x1="978" y1="126" x2="1000" y2="126"/>

    <text class="cap" x="360" y="232">Bedrock gestiona la ingesta y la búsqueda · consulta con boto3 desde Lambda</text>
    <line class="div" x1="40" y1="262" x2="1140" y2="262"/>

    <!-- FASE 2 -->
    <rect class="pill" x="40" y="276" width="76" height="28" rx="14"/>
    <text class="pt" x="78" y="295">Fase 2</text>
    <text class="ft" x="40" y="346">Piezas propias con AWS</text>
    <text class="fs" x="40" y="372">Corte y prompt propios, modelos de AWS</text>

    <rect class="box" x="360" y="296" width="132" height="84" rx="12"/>
    <text class="n" x="426" y="336">Documentos</text><text class="s" x="426" y="358">.txt</text>
    <rect class="box" x="522" y="296" width="132" height="84" rx="12"/>
    <text class="n" x="588" y="336">Corte propio</text><text class="s" x="588" y="358">Python · 500 / 100</text>
    <rect class="box" x="684" y="296" width="132" height="84" rx="12"/>
    <text class="n" x="750" y="336">Titan V2</text><text class="s" x="750" y="358">Embeddings</text>
    <rect class="box" x="846" y="296" width="132" height="84" rx="12"/>
    <text class="n" x="912" y="336">ChromaDB</text><text class="s" x="912" y="358">Base vectorial</text>
    <rect class="gen" x="1008" y="296" width="132" height="84" rx="12"/>
    <text class="n" x="1074" y="336">Nova Lite</text><text class="s" x="1074" y="358">Generación</text>

    <line class="ln" x1="496" y1="338" x2="518" y2="338"/>
    <line class="ln" x1="658" y1="338" x2="680" y2="338"/>
    <line class="ln" x1="820" y1="338" x2="842" y2="338"/>
    <line class="ln" x1="982" y1="338" x2="1004" y2="338"/>

    <text class="cap" x="360" y="416">Piezas visibles · código propio con boto3</text>
    <line class="div" x1="40" y1="446" x2="1140" y2="446"/>

    <!-- FASE 3 -->
    <rect class="pill" x="40" y="460" width="76" height="28" rx="14"/>
    <text class="pt" x="78" y="479">Fase 3</text>
    <text class="ft" x="40" y="530">Fuera de AWS</text>
    <text class="fs" x="40" y="556">El mismo patrón con otro proveedor</text>

    <rect class="box" x="360" y="480" width="132" height="84" rx="12"/>
    <text class="n" x="426" y="520">Documentos</text><text class="s" x="426" y="542">.txt</text>
    <rect class="box" x="522" y="480" width="132" height="84" rx="12"/>
    <text class="n" x="588" y="508">Splitter de</text><text class="n" x="588" y="528">LangChain</text><text class="s" x="588" y="548">500 / 100</text>
    <rect class="box" x="684" y="480" width="132" height="84" rx="12"/>
    <text class="n" x="750" y="520">Gemini</text><text class="s" x="750" y="542">Embeddings</text>
    <rect class="box" x="846" y="480" width="132" height="84" rx="12"/>
    <text class="n" x="912" y="520">ChromaDB</text><text class="s" x="912" y="542">Base vectorial</text>
    <rect class="gen" x="1008" y="480" width="132" height="84" rx="12"/>
    <text class="n" x="1074" y="520">Gemini</text><text class="s" x="1074" y="542">Generación</text>

    <line class="ln" x1="496" y1="522" x2="518" y2="522"/>
    <line class="ln" x1="658" y1="522" x2="680" y2="522"/>
    <line class="ln" x1="820" y1="522" x2="842" y2="522"/>
    <line class="ln" x1="982" y1="522" x2="1004" y2="522"/>

    <text class="cap" x="360" y="600">Mismo patrón · orquestación con LangChain</text>
  </g>
</svg>
